apiVersion: apps/v1
kind: Deployment
metadata:
  name: chakra-api
  labels:
    app: chakra
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chakra
  template:
    metadata:
      labels:
        app: chakra
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: chakra-api
        image: your-registry/chakra-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: chakra-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
