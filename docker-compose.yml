version: "3.8"

services:
  chakra-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://chakra:chakra_pass@postgres:5432/chakra
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - chakra-network
    restart: always

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=chakra
      - POSTGRES_PASSWORD=chakra_pass
      - POSTGRES_DB=chakra
    ports:
      - "5432:5432"
    volumes:
      - chakra_pg_data:/var/lib/postgresql/data
    networks:
      - chakra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chakra"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - chakra_redis_data:/data
    networks:
      - chakra-network

volumes:
  chakra_pg_data:
  chakra_redis_data:

networks:
  chakra-network:
    driver: bridge
